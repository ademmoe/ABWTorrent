# ─────────────────────────────────────────────
# ABWTorrent Configuration
# ─────────────────────────────────────────────

watch_dir: /media/nas/iso/Operating_Systems/Linux
torrent_output_dir: /media/nas/platz219/torrents

transmission:
  host: 127.0.0.1
  port: 9091
  username: abwtorrent
  password: changeme

torrent:
  piece_size: 4194304        # 4 MiB — optimal for large ISOs
  comment: "ABWTorrent - Internal LAN ISO Distribution"
  created_by: "ABWTorrent"

file_stability:
  check_interval: 2          # seconds between size checks
  stable_count: 3            # consecutive unchanged checks before processing

web:
  host: 0.0.0.0
  port: 8080
  secret_key: null           # auto-generated on first run

users:
  admin:
    password_hash: null       # set on first login via Web UI
    role: admin

log:
  level: INFO
  file: /var/log/abwtorrent/watchdog.log
