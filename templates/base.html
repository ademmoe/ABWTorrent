<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ABWTorrent — Internal LAN ISO distribution dashboard">
  <title>{% block title %}ABWTorrent{% endblock %}</title>
  <!-- Materialize CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/materialize.min.css') }}">
  <!-- Material Icons -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/material-icons.css') }}">
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      display: flex;
      flex-direction: column;
      background-color: #fafafa;
    }
    header {
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    main {
      flex: 1;
      overflow-y: auto;
      padding: 2rem;
    }
    footer {
      flex-shrink: 0;
      padding: 1rem;
      background-color: #f5f5f5;
      border-top: 1px solid #ddd;
      font-size: 0.75rem;
      color: #666;
      text-align: center;
    }
    .sidenav-fixed {
      position: fixed;
      left: 0;
      top: 0;
      height: 100vh;
      z-index: 99;
      transition: transform 0.3s ease;
    }
    body.has-sidebar .sidenav-fixed {
      transform: translateX(0);
    }
    body.has-sidebar.sidebar-closed .sidenav-fixed {
      transform: translateX(-100%);
    }
    .brand-logo {
      padding-left: 3rem !important;
    }
    .toast-success { background-color: #4caf50; }
    .toast-error { background-color: #f44336; }
    @media only screen and (max-width: 992px) {
      .sidenav-fixed {
        width: 85% !important;
        max-width: 300px;
      }
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <!-- Navbar Header -->
  <header>
    <nav class="indigo top-nav">
      <div class="nav-wrapper">
        <a href="#" id="sidebar-toggle" class="sidenav-trigger show-on-large" style="display: inline-block; margin-left: 1rem;"><i class="material-icons">menu</i></a>
        <a href="#!" class="brand-logo">{% block page_title %}ABWTorrent{% endblock %}</a>
      </div>
    </nav>
  </header>

  <!-- Sidebar -->
  {% block sidebar %}{% endblock %}

  <!-- Main Content -->
  <main>
    {% block body %}{% endblock %}
  </main>

  <!-- Footer with Credits -->
  <footer>
    <div>
      <strong>ABWTorrent</strong> — Developed by Adem Karagöz | Credits: Dominic Naumann, Sönke Einnolf
    </div>
  </footer>

  <!-- Materialize JS -->
  <script src="{{ url_for('static', filename='js/materialize.min.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
