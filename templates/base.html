<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ABWTorrent — Internal LAN ISO distribution dashboard">
  <title>{% block title %}ABWTorrent{% endblock %}</title>
  <!-- Materialize CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/materialize.min.css') }}">
  <!-- Material Icons -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/material-icons.css') }}">
  <style>
    body {
      display: flex;
      min-height: 100vh;
      flex-direction: column;
      background-color: #fafafa;
    }
    main {
      flex: 1 0 auto;
    }
    .brand-logo {
      padding-left: 3rem !important;
    }
    /* Dashboard specific layout */
    body.has-sidebar {
      display: flex;
      flex-direction: row;
    }
    body.has-sidebar .sidenav-fixed {
      width: 300px;
      flex-shrink: 0;
      transition: all 0.3s ease;
    }
    body.has-sidebar.sidebar-collapsed .sidenav-fixed {
      width: 0;
      overflow: hidden;
    }
    body.has-sidebar header, 
    body.has-sidebar main, 
    body.has-sidebar footer {
      flex: 1;
      transition: all 0.3s ease;
    }
    @media only screen and (max-width : 992px) {
      body.has-sidebar header, 
      body.has-sidebar main, 
      body.has-sidebar footer {
        padding-left: 0;
      }
      body.has-sidebar .sidenav-fixed {
        display: none;
      }
    }
    .toast-success { background-color: #4caf50; }
    .toast-error { background-color: #f44336; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block body %}{% endblock %}
  <!-- Materialize JS -->
  <script src="{{ url_for('static', filename='js/materialize.min.js') }}"></script>
  <script>
    // Sidebar collapse toggle
    document.addEventListener('DOMContentLoaded', function() {
      const toggleBtn = document.getElementById('sidebar-toggle');
      const body = document.body;
      
      if (toggleBtn) {
        toggleBtn.addEventListener('click', function(e) {
          e.preventDefault();
          if (window.innerWidth > 992) {
            body.classList.toggle('sidebar-collapsed');
          }
        });
      }
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
